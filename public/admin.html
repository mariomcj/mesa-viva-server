<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Administração — Mesa Viva</title>
<style>
:root {
  color-scheme: dark;
  --fundo: #0d0a0a;
  --sup: #1a1410;
  --sup-2: #221b15;
  --sup-3: #2b221a;
  --borda: #3a2f25;
  --borda-forte: #57483a;
  --grade: #2a221b;
  --eixo: #4d4033;
  --tinta: #efe7da;
  --tinta-2: #c4b9a8;
  --tinta-3: #9c9181;
  --ouro: #c8a050;
  --ouro-claro: #e6c57c;
  --ouro-tinta: #1b1307;
  --perigo: #8a2f26;
  --perigo-tinta: #f0a094;
  --bom: #7cc47f;
  --ruim: #ec9a8a;
  /* Séries dos gráficos: conferidas com o validador de paleta sobre a superfície #1a1410 */
  --s1: #bf8a2c;
  --s2: #4a90e2;
  --s3: #d55181;
  --raio: 10px;
  --fonte: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { font: 14px/1.5 var(--fonte); background: var(--fundo); color: var(--tinta); min-height: 100vh; overflow-x: hidden; }
body.com-modal { overflow: hidden; }
a { color: var(--ouro-claro); }
h1, h2, h3 { font-weight: 600; line-height: 1.25; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ouro-claro); outline-offset: 2px; border-radius: 4px; }
.so-leitor { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
.pular { position: absolute; left: 8px; top: -60px; z-index: 300; background: var(--ouro); color: var(--ouro-tinta); padding: .5rem .8rem; border-radius: 6px; font-weight: 600; }
.pular:focus { top: 8px; }

/* Botões e campos */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 38px; padding: .45rem .9rem; border-radius: 8px; border: 1px solid var(--borda-forte); background: var(--sup-2); color: var(--tinta); cursor: pointer; font-size: .9rem; font-weight: 500; text-decoration: none; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--sup-3); border-color: var(--ouro); }
.btn[disabled] { opacity: .55; cursor: default; }
.btn-primario { background: var(--ouro); border-color: var(--ouro); color: var(--ouro-tinta); font-weight: 600; }
.btn-primario:hover { background: var(--ouro-claro); border-color: var(--ouro-claro); }
.btn-perigo { background: var(--perigo); border-color: #a8473c; color: #fff; }
.btn-perigo:hover { background: #a03a30; border-color: var(--perigo-tinta); }
.btn-p { min-height: 32px; padding: .25rem .65rem; font-size: .82rem; }
.btn-link { background: none; border: none; padding: 0; min-height: 0; color: var(--ouro-claro); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.btn-link:hover { color: #fff; }
label, .rotulo { display: block; font-size: .8rem; color: var(--tinta-2); margin-bottom: .25rem; }
input, select, textarea { width: 100%; min-height: 38px; background: #120e0b; color: var(--tinta); border: 1px solid var(--borda-forte); border-radius: 8px; padding: .45rem .6rem; }
textarea { min-height: 72px; resize: vertical; }
input:hover, select:hover, textarea:hover { border-color: var(--tinta-3); }
::placeholder { color: var(--tinta-3); opacity: 1; }
.campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
.campos .inteira { grid-column: 1 / -1; }
.acoes { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
.acoes .empurra { margin-left: auto; }
.erro { color: var(--ruim); font-size: .88rem; margin-top: .6rem; }
.erro:empty { display: none; }
.suave { color: var(--tinta-3); font-size: .85rem; }

/* Login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 1rem; background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(200,160,80,.13), transparent 70%); }
.login-caixa { width: 100%; max-width: 380px; background: var(--sup); border: 1px solid var(--borda); border-radius: 14px; padding: 2rem 1.5rem; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
.login-caixa h1 { font-size: 1.35rem; margin: .6rem 0 .2rem; }
.login-caixa .suave { margin-bottom: 1.2rem; }
.login-caixa label { margin-top: .9rem; }
.login-caixa .btn { width: 100%; margin-top: 1.2rem; }
.marca-icone { width: 28px; height: 28px; flex: none; color: var(--ouro); }

/* Topo e abas */
.topo { background: var(--sup); border-bottom: 1px solid var(--borda); position: sticky; top: 0; z-index: 50; }
.topo-in, .abas-in, .pagina { max-width: 1312px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
.topo-in { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding-top: .6rem; padding-bottom: .5rem; }
.marca { display: flex; align-items: center; gap: .55rem; min-width: 0; }
.marca h1 { font-size: 1.05rem; white-space: nowrap; }
.marca small { color: var(--tinta-3); font-size: .78rem; font-weight: 400; margin-left: .3rem; }
.conta { display: flex; align-items: center; gap: .6rem; font-size: .85rem; color: var(--tinta-2); min-width: 0; }
.conta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 30vw; }
.abas { overflow-x: auto; scrollbar-width: none; }
.abas::-webkit-scrollbar { display: none; }
.abas-in { display: flex; gap: .25rem; }
.aba { flex: none; background: none; border: none; border-bottom: 3px solid transparent; padding: .55rem .8rem .5rem; color: var(--tinta-2); cursor: pointer; font-size: .92rem; white-space: nowrap; }
.aba:hover { color: var(--tinta); }
.aba[aria-current="page"] { color: var(--ouro-claro); border-bottom-color: var(--ouro); font-weight: 600; }
.aba .conta-n { display: inline-block; min-width: 1.5em; margin-left: .3rem; padding: 0 .4em; border-radius: 99px; background: var(--sup-3); color: var(--tinta-2); font-size: .75rem; font-weight: 600; text-align: center; }

/* Página */
.pagina { padding-top: 1.1rem; padding-bottom: 3rem; }
.pagina:focus { outline: none; }
.pag-topo { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin-bottom: 1rem; }
.pag-topo h2 { font-size: 1.3rem; margin-right: auto; }
.pag-ferramentas { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
.periodo { display: inline-flex; border: 1px solid var(--borda-forte); border-radius: 8px; overflow: hidden; background: var(--sup-2); }
.periodo button { background: none; border: none; border-right: 1px solid var(--borda-forte); padding: .35rem .75rem; min-height: 36px; cursor: pointer; color: var(--tinta-2); font-size: .85rem; }
.periodo button:last-child { border-right: none; }
.periodo button:hover { color: var(--tinta); background: var(--sup-3); }
.periodo button[aria-pressed="true"] { background: var(--ouro); color: var(--ouro-tinta); font-weight: 600; }
.periodo button:focus-visible { outline-offset: -3px; }
.periodo button[aria-pressed="true"]:focus-visible { outline-color: var(--ouro-tinta); }
#corpo { transition: opacity .15s; }
#corpo.ocupado { opacity: .5; pointer-events: none; }
.secao-t { font-size: 1rem; margin: 1.5rem 0 .6rem; display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.secao-t .suave { font-weight: 400; }
.faixa { border: 1px solid var(--borda-forte); border-left: 3px solid var(--ouro); background: var(--sup-2); border-radius: 8px; padding: .65rem .9rem; margin-bottom: 1rem; color: var(--tinta-2); font-size: .88rem; }
.faixa strong { color: var(--tinta); }

/* Cartões */
.cartao { background: var(--sup); border: 1px solid var(--borda); border-radius: var(--raio); padding: 1rem; min-width: 0; }
.cartao-topo { margin-bottom: .7rem; }
.cartao-topo h3 { font-size: .98rem; }
.cartao-topo .sub { color: var(--tinta-3); font-size: .8rem; margin-top: .1rem; }
.cartao h4 { font-size: .85rem; font-weight: 600; color: var(--tinta-2); margin: 1rem 0 .4rem; }
.grade { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); margin-bottom: 12px; }
@media (min-width: 760px) { .g2, .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 > :last-child:nth-child(odd) { grid-column: 1 / -1; } }
@media (min-width: 1120px) { .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .g3 > :last-child:nth-child(odd) { grid-column: auto; } }
.larga { grid-column: 1 / -1; }

/* Indicadores */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 12px; }
.kpis > .kpi:first-child:nth-last-child(odd) { grid-column: 1 / -1; }
@media (min-width: 760px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpis > .kpi:first-child:nth-last-child(odd) { grid-column: auto; } }
@media (min-width: 1120px) { .kpis { grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); } }
.kpi { background: var(--sup); border: 1px solid var(--borda); border-radius: var(--raio); padding: .85rem .9rem .75rem; min-width: 0; display: flex; flex-direction: column; }
.kpi-rot { font-size: .8rem; font-weight: 500; color: var(--tinta-2); }
.kpi-val { font-size: clamp(1.35rem, 5.2vw, 1.8rem); font-weight: 650; line-height: 1.15; margin-top: .2rem; color: var(--tinta); overflow-wrap: anywhere; }
.kpi-delta { font-size: .78rem; color: var(--tinta-2); margin-top: .25rem; }
.kpi-delta b { font-weight: 600; }
.kpi-delta.bom b { color: var(--bom); }
.kpi-delta.ruim b { color: var(--ruim); }
.kpi-ctx { color: var(--tinta-3); }
.kpi-spark { margin-top: auto; padding-top: .5rem; height: 40px; }
.kpi-spark svg { display: block; width: 100%; height: 32px; }
.totais { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 1px; background: var(--sup); border: 1px solid var(--borda); border-radius: var(--raio); overflow: hidden; margin-bottom: 12px; }
.totais div { background: var(--sup); padding: .55rem .8rem; box-shadow: 0 0 0 1px var(--borda); }
.totais dt { font-size: .75rem; color: var(--tinta-3); }
.totais dd { font-size: 1.05rem; font-weight: 600; }

/* Gráficos */
.legenda { display: flex; flex-wrap: wrap; gap: .2rem 1rem; margin-bottom: .4rem; font-size: .8rem; color: var(--tinta-2); list-style: none; }
.legenda li { display: inline-flex; align-items: center; gap: .4rem; }
.chave { display: inline-block; flex: none; width: 14px; height: 3px; border-radius: 2px; }
.chave.bloco { width: 10px; height: 10px; border-radius: 2px; }
.plot { position: relative; min-height: 60px; }
.plot svg { display: block; width: 100%; height: auto; touch-action: pan-y; cursor: crosshair; border-radius: 6px; -webkit-tap-highlight-color: transparent; }
.plot svg text { font: 11px var(--fonte); fill: var(--tinta-3); font-variant-numeric: tabular-nums; }
.plot .vazio-sobre { position: absolute; inset: 0 0 26px 0; display: grid; place-items: center; color: var(--tinta-3); font-size: .85rem; pointer-events: none; text-align: center; padding: 0 1rem; }
.dica { position: absolute; z-index: 5; top: 0; left: 0; pointer-events: none; background: #0f0b09; border: 1px solid var(--borda-forte); border-radius: 8px; padding: .45rem .6rem; font-size: .8rem; box-shadow: 0 6px 20px rgba(0,0,0,.55); white-space: nowrap; max-width: 92%; }
.dica-t { color: var(--tinta-2); margin-bottom: .2rem; font-size: .76rem; }
.dica-l { display: flex; align-items: center; gap: .4rem; }
.dica-l strong { font-weight: 650; color: var(--tinta); font-variant-numeric: tabular-nums; }
.dica-l span:last-child { color: var(--tinta-2); overflow: hidden; text-overflow: ellipsis; }
.dica-total { border-top: 1px solid var(--borda); margin-top: .25rem; padding-top: .25rem; }
details.dados { margin-top: .5rem; }
details.dados summary { cursor: pointer; color: var(--tinta-3); font-size: .78rem; width: max-content; max-width: 100%; padding: .15rem 0; }
details.dados summary:hover { color: var(--tinta); }
details.dados .rolagem { max-height: 260px; margin-top: .4rem; }
.vazio { border: 1px dashed var(--borda-forte); border-radius: 8px; padding: 1.4rem 1rem; text-align: center; color: var(--tinta-3); font-size: .88rem; }
.barras { list-style: none; display: grid; gap: .5rem; }
.barras li { display: grid; grid-template-columns: minmax(72px, 34%) minmax(0, 1fr) auto; align-items: center; gap: .6rem; font-size: .85rem; }
.b-nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--tinta-2); }
.b-trilho { height: 12px; display: block; }
.b-barra { display: block; height: 100%; min-width: 2px; background: var(--s1); border-radius: 0 4px 4px 0; }
.b-valor { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
.b-valor small { font-weight: 400; color: var(--tinta-3); margin-left: .3rem; }
.segmentos { display: flex; gap: 2px; height: 8px; border-radius: 99px; overflow: hidden; margin: .4rem 0; }
.segmentos span { display: block; min-width: 2px; }

/* Tabelas */
.rolagem { overflow: auto; border: 1px solid var(--borda); border-radius: 8px; max-width: 100%; }
.rolagem.alta { max-height: 460px; }
.tabela { width: 100%; border-collapse: collapse; font-size: .85rem; }
.tabela th, .tabela td { text-align: left; padding: .5rem .7rem; border-bottom: 1px solid var(--grade); vertical-align: middle; }
.tabela thead th { position: sticky; top: 0; background: var(--sup-2); color: var(--tinta-2); font-weight: 600; font-size: .78rem; white-space: nowrap; z-index: 1; }
.tabela tbody tr:last-child td { border-bottom: none; }
.tabela tbody tr:hover td { background: rgba(200,160,80,.06); }
.tabela .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabela .nq { white-space: nowrap; }
.tabela .btn-link { padding: .4rem .25rem; margin: -.4rem -.25rem; }
.tabela .corta { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.selo { display: inline-flex; align-items: center; gap: .35rem; padding: .1rem .55rem; border-radius: 99px; font-size: .76rem; font-weight: 600; border: 1px solid var(--borda-forte); color: var(--tinta-2); white-space: nowrap; }
.selo::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.selo-jogo { color: var(--bom); border-color: #3f6b42; }
.selo-saguao { color: #9db7dc; border-color: #445a78; }
.chips { display: flex; flex-wrap: wrap; gap: .35rem; list-style: none; }
.chips li { background: var(--sup-3); border: 1px solid var(--borda); border-radius: 99px; padding: .1rem .6rem; font-size: .82rem; }
.lista-simples { list-style: none; display: grid; gap: .3rem; font-size: .88rem; }
.lista-simples li { overflow-wrap: anywhere; }
.busca { max-width: 260px; }

/* Estados */
.carregando { display: grid; gap: 12px; }
.osso { height: 92px; border-radius: var(--raio); background: linear-gradient(90deg, var(--sup) 0%, var(--sup-2) 50%, var(--sup) 100%); background-size: 200% 100%; animation: brilho 1.4s linear infinite; border: 1px solid var(--borda); }
.osso.alto { height: 240px; }
@keyframes brilho { to { background-position: -200% 0; } }
.caixa-erro { border: 1px solid #7a3a31; background: #1f1210; border-radius: var(--raio); padding: 1rem; }
.caixa-erro p { margin-bottom: .7rem; }

/* Modais e avisos */
.modal-fundo { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.66); display: flex; align-items: flex-start; justify-content: center; padding: 4vh 8px; overflow-y: auto; }
.modal { background: var(--sup); border: 1px solid var(--borda-forte); border-radius: 12px; width: 100%; max-width: 480px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
.modal-largo { max-width: 760px; }
.modal-topo { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 1rem; border-bottom: 1px solid var(--borda); }
.modal-topo h2 { font-size: 1.05rem; overflow-wrap: anywhere; }
.btn-x { flex: none; width: 34px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--tinta-2); font-size: 1.3rem; line-height: 1; cursor: pointer; }
.btn-x:hover { background: var(--sup-3); color: var(--tinta); }
.modal-corpo { padding: 1rem; }
.modal-corpo h3 { font-size: .92rem; margin: 1.2rem 0 .5rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.avisos { position: fixed; right: 12px; bottom: 12px; left: 12px; z-index: 200; display: grid; gap: .4rem; justify-items: end; pointer-events: none; }
.aviso-item { background: #0f0b09; border: 1px solid var(--borda-forte); border-left: 3px solid var(--bom); border-radius: 8px; padding: .55rem .8rem; font-size: .88rem; max-width: 420px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.aviso-item.falha { border-left-color: var(--ruim); }

@media (max-width: 520px) {
  .campos { grid-template-columns: minmax(0, 1fr); }
  .marca small { display: none; }
  .busca { max-width: none; }
  .pag-topo h2 { width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media (forced-colors: active) {
  .b-barra, .chave, .segmentos span { forced-color-adjust: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="vivo" class="so-leitor" aria-live="polite"></div>
<div id="avisos" class="avisos" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ═══════════ Utilidades ═══════════ */
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
const $ = (sel, raiz) => (raiz || document).querySelector(sel);
const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const limitar = (v, a, b) => Math.max(a, Math.min(b, v));
const NF = new Intl.NumberFormat('pt-BR');
const NFC = new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 });
const fInt = (v) => NF.format(Math.round(num(v)));
const fCompacto = (v) => (Math.abs(num(v)) >= 10000 ? NFC.format(num(v)) : fInt(v));
const fDec = (v, casas) => num(v).toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
/** Custo em dólares: 2 casas a partir de US$ 1, até 4 casas abaixo disso (os valores do provedor são pequenos). */
const fUSD = (v) => { const n = num(v); return 'US$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: Math.abs(n) >= 1 ? 2 : 4 }); };
const fUSD4 = (v) => 'US$ ' + fDec(v, 4);
const fPct = (v) => num(v).toLocaleString('pt-BR', { maximumFractionDigits: Math.abs(v) >= 10 ? 0 : 1 }) + '%';

function partesDoDia(d) { const p = String(d || '').split('-').map(Number); return p.length === 3 && p.every(Number.isFinite) ? p : null; }
const diaCurto = (d) => { const p = String(d || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] : String(d || '—'); };
const diaCompleto = (d) => { const p = String(d || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : String(d || '—'); };
const diaLongo = (d) => { const p = partesDoDia(d); return p ? new Date(p[0], p[1] - 1, p[2]).toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' }) : String(d || '—'); };
function fDataHora(ms) {
  if (!num(ms)) return '—';
  return new Date(num(ms)).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function fData(ms) { return num(ms) ? new Date(num(ms)).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—'; }
function fHora(ms) { return new Date(num(ms) || Date.now()).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
function haQuanto(ms) {
  if (!num(ms)) return '—';
  const s = Math.max(0, (Date.now() - num(ms)) / 1000);
  if (s < 90) return 'agora há pouco';
  if (s < 3600) return 'há ' + Math.round(s / 60) + ' min';
  if (s < 86400) return 'há ' + Math.round(s / 3600) + ' h';
  const d = Math.round(s / 86400);
  return d <= 30 ? 'há ' + d + (d === 1 ? ' dia' : ' dias') : fData(ms);
}
/** Cria um elemento HTML; textos sempre por textContent. */
function h(tag, attrs, filhos) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {

  return '<div class="carregando" role="status"><span class="so-leitor">Carregando…</span><div class="osso"></div><div class="osso alto"></div></div>';
}
function htmlErro(e, oQue) {
  return '<div class="caixa-erro" role="alert"><p><strong>Não foi possível carregar ' + esc(oQue) + '.</strong><br>' + esc(e && e.message ? e.message : 'Erro desconhecido.') +
    '</p><button type="button" class="btn" data-acao="recarregar">Tentar de novo</button></div>';
}
function htmlPeriodo() {
  return '<div class="periodo" role="group" aria-label="Período">' + PERIODOS.map((d) =>
    '<button type="button" data-acao="periodo" data-dias="' + d + '" aria-pressed="' + (APP._dias === d) + '">' + d + ' dias</button>').join('') + '</div>';
}
function htmlTopoPagina(titulo, extras) {
  return '<div class="pag-topo"><h2>' + esc(titulo) + '</h2><div class="pag-ferramentas">' + (extras || '') +
    '<span class="suave" id="atualizado"></span><button type="button" class="btn btn-p" data-acao="recarregar">Atualizar</button></div></div>';
}
function htmlCartao(id, titulo, sub, classe) {
  return '<section class="cartao ' + (classe || '') + '" aria-labelledby="t-' + id + '"><div class="cartao-topo"><h3 id="t-' + id + '">' + esc(titulo) + '</h3>' +
    (sub ? '<p class="sub">' + esc(sub) + '</p>' : '') + '</div><div id="' + id + '"></div></section>';
}
/** Variação contra o período anterior. bomSubir: true (subir é bom), false (subir é ruim) ou null (neutro). */
function htmlDelta(atual, anterior, contexto, bomSubir) {
  atual = num(atual); anterior = num(anterior);
  const ctx = ' <span class="kpi-ctx">' + esc(contexto) + '</span>';
  if (!anterior && !atual) return '<p class="kpi-delta"><b>Sem movimento</b>' + ctx + '</p>';
  if (!anterior) return '<p class="kpi-delta"><b>Sem base de comparação</b> <span class="kpi-ctx">(o período anterior ficou em zero)</span></p>';
  const p = ((atual - anterior) / anterior) * 100;
  if (Math.abs(p) < 0.05) return '<p class="kpi-delta"><b><span aria-hidden="true">＝</span> Estável</b>' + ctx + '</p>';
  const sobe = p > 0, cls = bomSubir === null || bomSubir === undefined ? '' : (sobe === bomSubir ? ' bom' : ' ruim');
  const txt = Math.abs(p) > 999 ? 'mais de 999%' : fPct(Math.abs(p));
  return '<p class="kpi-delta' + cls + '"><b><span aria-hidden="true">' + (sobe ? '▲' : '▼') + '</span><span class="so-leitor">' + (sobe ? 'subiu' : 'caiu') + '</span> ' + txt + '</b>' + ctx + '</p>';
}
function htmlKpi(rotulo, valor, deltaHtml, sparkId) {
  return '<article class="kpi"><h3 class="kpi-rot">' + esc(rotulo) + '</h3><p class="kpi-val">' + esc(valor) + '</p>' + (deltaHtml || '') +
    (sparkId ? '<div class="kpi-spark" id="' + sparkId + '"></div>' : '') + '</article>';
}
const htmlSub = (txt) => '<p class="kpi-delta"><span class="kpi-ctx">' + esc(txt) + '</span></p>';
function seloFase(fase) {
  if (fase === 'jogo') return '<span class="selo selo-jogo">Em jogo</span>';
  if (fase === 'lobby') return '<span class="selo selo-saguao">No saguão</span>';
  return '<span class="selo">' + esc(fase || '—') + '</span>';
}
function marcarAtualizado(ms) { const e = $('#atualizado'); if (e) e.textContent = 'Atualizado às ' + fHora(ms); }

/* ═══════════ Estrutura: login e casca ═══════════ */
function renderApp() {
  const app = $('#app');
  limparGraficos();
  if (!APP._token) {
    app.innerHTML =
      '<main class="login"><form class="login-caixa" data-form="login" novalidate>' + ICONE +
      '<h1>Mesa Viva — Administração</h1><p class="suave">Entre com a conta de administrador do servidor.</p>' +
      (APP._avisoLogin ? '<p class="faixa" role="status">' + esc(APP._avisoLogin) + '</p>' : '') +
      '<label for="luser">Usuário</label><input id="luser" name="user" value="admin" autocomplete="username" autocapitalize="none" spellcheck="false" required>' +
      '<label for="lpass">Senha</label><input id="lpass" name="pass" type="password" autocomplete="current-password" required>' +
      '<button class="btn btn-primario" type="submit">Entrar</button><p class="erro" role="alert" data-erro></p></form></main>';
    const campo = $('#lpass'); if (campo) campo.focus();
    return;
  }
  app.innerHTML =
    '<a class="pular" href="#conteudo">Pular para o conteúdo</a>' +
    '<header class="topo"><div class="topo-in"><div class="marca">' + ICONE + '<h1>Mesa Viva <small>Administração</small></h1></div>' +
    '<div class="conta"><span title="Conta conectada">' + esc(APP._user) + '</span><button type="button" class="btn btn-p" data-acao="sair">Sair</button></div></div>' +
    '<nav class="abas" aria-label="Seções do painel"><div class="abas-in">' + ABAS.map((a) =>
      '<button type="button" class="aba" data-acao="aba" data-aba="' + a[0] + '">' + a[1] + (a[0] === 'mesas' ? '<span class="conta-n" id="n-mesas" hidden></span>' : '') + '</button>').join('') +
    '</div></nav></header><main id="conteudo" class="pagina" tabindex="-1"></main>';
  renderAba();
  if (!APP._mesas) APP.listarMesas().then((d) => { APP._mesas = d.mesas || []; marcarContagem(); }).catch(() => {});
}
function marcarContagem() {
  const e = $('#n-mesas'); if (!e || !APP._mesas) return;
  e.hidden = false; e.textContent = fInt(APP._mesas.length); e.setAttribute('aria-label', APP._mesas.length + ' mesas');
}
function renderAba(manter) {
  document.querySelectorAll('.aba').forEach((b) => {
    if (b.dataset.aba !== APP._tab) { b.removeAttribute('aria-current'); return; }
    b.setAttribute('aria-current', 'page');
    const faixa = b.closest('.abas'), rb = b.getBoundingClientRect(), rf = faixa ? faixa.getBoundingClientRect() : null;   // no celular a faixa de abas rola: a aba atual tem de ficar inteira à vista
    if (rf && rb.right > rf.right) faixa.scrollLeft += rb.right - rf.right + 8; else if (rf && rb.left < rf.left) faixa.scrollLeft -= rf.left - rb.left + 8;
  });
  marcarContagem();
  const main = $('#conteudo'); if (!main) return;
  const seq = ++APP._seq;
  let corpo = manter ? $('#corpo[data-aba="' + APP._tab + '"]', main) : null;
  if (!corpo) {
    limparGraficos();
    const tem = APP._tab === 'geral' || APP._tab === 'uso';
    const titulo = ABAS.find((a) => a[0] === APP._tab)[1];
    main.innerHTML = htmlTopoPagina(titulo, tem ? htmlPeriodo() : '') + '<div id="corpo" data-aba="' + APP._tab + '">' + htmlCarregando() + '</div>';
    corpo = $('#corpo', main);
  } else {
    corpo.classList.add('ocupado');
    main.querySelectorAll('.periodo button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.dias) === APP._dias)));
  }
  corpo.setAttribute('aria-busy', 'true');
  const vivo = () => seq === APP._seq && document.contains(corpo);
  const fim = () => {
    if (!vivo()) return;
    corpo.classList.remove('ocupado'); corpo.removeAttribute('aria-busy');
    // a lista foi refeita e o botão que tinha o foco sumiu (mesa excluída, por exemplo): o foco volta para o conteúdo, e não para o topo da página
    if (!MODAIS.length && document.activeElement === document.body) main.focus({ preventScroll: true });
  };
  const telas = { geral: telaGeral, mesas: telaMesas, usuarios: telaUsuarios, uso: telaUso };
  const nomes = { geral: 'a visão geral', mesas: 'as mesas', usuarios: 'os usuários', uso: 'o uso da IA' };
  telas[APP._tab](corpo, vivo).catch((e) => { if (vivo() && APP._token) { limparGraficos(); corpo.innerHTML = htmlErro(e, nomes[APP._tab]); } }).then(fim);
}

/* ═══════════ Visão geral ═══════════ */
async function telaGeral(corpo, vivo) {
  const m = await APP.getMetricas(APP._dias);
  if (!vivo()) return;
  if (!m) { const st = await APP.getEstatisticas(); if (vivo()) montarGeralAntigo(corpo, st); return; }
  limparGraficos();
  const seletor = $('.periodo'); if (seletor) seletor.hidden = false;
  const t = m.totais || {}, p = m.periodo || {}, a = m.anterior || {}, serie = m.serie || [], dias = num(m.dias) || serie.length;
  const ctx = 'em relação aos ' + dias + ' dias anteriores';
  // jogadores ativos: média diária dos últimos 7 dias contra os 7 anteriores (quando o período permite)
  const ativos = serie.map((d) => num(d.jogadoresAtivos));
  let deltaAtivos = htmlSub('contas que jogaram nos últimos 7 dias');
  if (ativos.length >= 14) {
    const u7 = soma(ativos.slice(-7)) / 7, a7 = soma(ativos.slice(-14, -7)) / 7;
    deltaAtivos = htmlDelta(u7, a7, 'na média diária, contra os 7 dias anteriores', true);
  }
  corpo.innerHTML =
    '<section class="kpis" aria-label="Indicadores principais">' +
      htmlKpi('Jogadores ativos em 7 dias', fInt(t.jogadoresAtivos7d), deltaAtivos, 'sp-ativos') +
      htmlKpi('Mesas em jogo', fInt(t.mesasEmJogo), htmlSub(fInt(t.mesasNoSaguao) + ' no saguão · ' + fInt(t.mesasAtivas7d) + ' ativas em 7 dias')) +
      htmlKpi('Narrações em ' + dias + ' dias', fCompacto(p.narracoes), htmlDelta(p.narracoes, a.narracoes, ctx, true), 'sp-narr') +
      htmlKpi('Custo de IA em ' + dias + ' dias', fUSD(p.custo), htmlDelta(p.custo, a.custo, ctx, null), 'sp-custo') +
      htmlKpi('Novos usuários em ' + dias + ' dias', fInt(p.usuariosNovos), htmlDelta(p.usuariosNovos, a.usuariosNovos, ctx, true), 'sp-usr') +
    '</section>' +
    '<dl class="totais" aria-label="Totais desde o início">' +
      [['Usuários', t.usuarios], ['Mesas', t.mesas], ['Aventuras concluídas', t.aventurasConcluidas], ['Personagens', t.fichas], ['Narrações', t.narracoes], ['Ações', t.acoes], ['Rolagens', t.rolagens]]
        .map((x) => '<div><dt>' + x[0] + '</dt><dd>' + fInt(x[1]) + '</dd></div>').join('') +
    '</dl>' +
    '<div class="grade g2">' +
      htmlCartao('g-atividade', 'Atividade por dia', 'Narrações do mestre e ações dos jogadores, de ' + diaCurto(m.desde) + ' a ' + diaCurto(m.ate), 'larga') +
      htmlCartao('g-novos', 'Novos usuários e novas mesas', 'Cadastros e mesas criadas por dia') +
      htmlCartao('g-horas', 'Quando se joga', 'Narrações por hora do dia, no horário de Brasília') +
    '</div><div class="grade g3">' +
      htmlCartao('g-temas', 'Mesas por tema', 'Todas as mesas') +
      htmlCartao('g-classes', 'Personagens por classe', 'Todas as fichas') +
      htmlCartao('g-niveis', 'Personagens por nível', 'Todas as fichas') +
    '</div><div class="grade">' +
      htmlCartao('g-ativas', 'Mesas mais ativas', 'Por narrações em ' + dias + ' dias') +
    '</div>';
  marcarAtualizado(m.geradoEm);
  minilinha($('#sp-ativos'), ativos);
  minilinha($('#sp-narr'), serie.map((d) => d.narracoes));
  minilinha($('#sp-custo'), serie.map((d) => d.custo));
  minilinha($('#sp-usr'), serie.map((d) => d.usuariosNovos));

  const rot = serie.map((d) => diaCurto(d.dia)), longos = serie.map((d) => diaLongo(d.dia));
  const at = $('#g-atividade');
  const a1 = h('div'), a2 = h('div');
  at.appendChild(a1); at.appendChild(h('h4', { text: 'Jogadores ativos por dia' })); at.appendChild(a2);
  graficoXY(a1, { tipo: 'linha', titulo: 'Narrações e ações por dia', rotulos: rot, rotulosLongos: longos, altura: 240, series: [
    { nome: 'Narrações', cor: 'var(--s1)', valores: serie.map((d) => num(d.narracoes)) },
    { nome: 'Ações', cor: 'var(--s2)', valores: serie.map((d) => num(d.acoes)) }] });
  graficoXY(a2, { tipo: 'linha', titulo: 'Jogadores ativos por dia', rotulos: rot, rotulosLongos: longos, altura: 150, series: [
    { nome: 'Jogadores ativos', cor: 'var(--s3)', valores: ativos, area: true, media: true }] });
  graficoXY($('#g-novos'), { tipo: 'linha', titulo: 'Novos usuários e novas mesas por dia', rotulos: rot, rotulosLongos: longos, series: [
    { nome: 'Novos usuários', cor: 'var(--s1)', valores: serie.map((d) => num(d.usuariosNovos)) },
    { nome: 'Novas mesas', cor: 'var(--s2)', valores: serie.map((d) => num(d.mesasNovas)) }] });
  const horas = Array.isArray(m.horas) ? m.horas.slice(0, 24) : [];
  graficoXY($('#g-horas'), { tipo: 'coluna', titulo: 'Narrações por hora do dia', colunaX: 'Hora', larguraRotulo: 44,
    rotulos: horas.map((_, i) => i + 'h'), rotulosLongos: horas.map((_, i) => 'Das ' + i + 'h às ' + (i + 1) + 'h'),
    series: [{ nome: 'Narrações', cor: 'var(--s1)', valores: horas.map(num) }] });

  barrasH($('#g-temas'), (m.temas || []).map((x) => ({ nome: x.nome || x.id || '—', valor: x.mesas })), { vazio: 'Nenhuma mesa criada ainda.' });
  montarIdiomas($('#g-temas'), m.idiomas);
  barrasH($('#g-classes'), (m.classes || []).map((x) => ({ nome: x.classe || '—', valor: x.personagens })), { vazio: 'Nenhum personagem criado ainda.' });
  const niveis = m.niveis || [];
  graficoXY($('#g-niveis'), { tipo: 'coluna', titulo: 'Personagens por nível', colunaX: 'Nível', larguraRotulo: 40, vazio: 'Nenhum personagem criado ainda.',
    rotulos: niveis.map((x) => String(x.nivel)), rotulosLongos: niveis.map((x) => 'Nível ' + x.nivel),
    series: [{ nome: 'Personagens', cor: 'var(--s1)', valores: niveis.map((x) => num(x.personagens)) }] });
  montarMaisAtivas($('#g-ativas'), m.mesasMaisAtivas || []);
}
function montarIdiomas(host, idiomas) {
  const nomes = { pt: 'Português', en: 'Inglês', es: 'Espanhol' };
  const lista = Object.keys(idiomas || {}).map((k) => ({ nome: nomes[k] || k, valor: num(idiomas[k]) })).filter((x) => x.valor > 0);
  const total = soma(lista.map((x) => x.valor));
  if (!total) return;
  host.appendChild(h('h4', { text: 'Idioma das mesas' }));
  const cores = ['var(--s1)', 'var(--s2)', 'var(--s3)'];
  if (lista.length <= 3) {
    host.appendChild(h('div', { class: 'segmentos', 'aria-hidden': 'true' }, lista.map((x, i) => { const sg = h('span'); sg.style.flex = String(x.valor); sg.style.background = cores[i]; return sg; })));
  }
  host.appendChild(h('ul', { class: 'legenda' }, lista.map((x, i) => {
    const chave = h('span', { class: 'chave bloco', 'aria-hidden': 'true' }); chave.style.background = lista.length <= 3 ? cores[i] : 'var(--tinta-3)';
    return h('li', null, [chave, h('span', { text: x.nome + ': ' + fInt(x.valor) + ' (' + fPct((x.valor / total) * 100) + ')' })]);
  })));
}
function montarMaisAtivas(host, mesas) {
  host.textContent = '';
  if (!mesas.length) { host.appendChild(caixaVazia('Nenhuma mesa teve narrações neste período.')); return; }
  host.innerHTML = '<div class="rolagem" tabindex="0" role="region" aria-label="Mesas mais ativas"><table class="tabela"><thead><tr>' +
    '<th scope="col">Mesa</th><th scope="col">Cena</th><th scope="col">Tema</th><th scope="col">Fase</th><th scope="col" class="num">Narrações</th><th scope="col" class="num">Jogadores</th><th scope="col">Última atividade</th></tr></thead><tbody>' +
    mesas.map((x) => '<tr><td><button type="button" class="btn-link" data-acao="abrir-mesa" data-cod="' + esc(x.codigo) + '" aria-label="Abrir a mesa ' + esc(x.codigo) + '">' + esc(x.codigo) + '</button></td>' +
      '<td class="corta" title="' + esc(x.cena || '') + '">' + esc(x.cena || '—') + '</td><td class="nq">' + esc(x.tema || '—') + '</td><td>' + seloFase(x.fase) + '</td>' +
      '<td class="num">' + fInt(x.narracoes) + '</td><td class="num">' + fInt(x.jogadores) + '</td><td class="nq" title="' + esc(fDataHora(x.ultimaAtividade)) + '">' + esc(haQuanto(x.ultimaAtividade)) + '</td></tr>').join('') +
    '</tbody></table></div>';
}
/** Servidor sem /api/admin/metricas: mostra o que /api/admin/estatisticas oferece. */
function montarGeralAntigo(corpo, st) {
  limparGraficos();
  const media = (a, b) => (num(b) > 0 ? fDec(num(a) / num(b), 1) : '0');
  const per = $('.periodo'); if (per) per.hidden = true;
  corpo.innerHTML =
    '<p class="faixa" role="status"><strong>Gráficos completos indisponíveis.</strong> Este servidor ainda não tem a rota de métricas (<code>/api/admin/metricas</code>). Atualize o servidor para ver atividade, custos e distribuições. Abaixo, os indicadores que já existem.</p>' +
    '<section class="kpis" style="--n:4" aria-label="Indicadores principais">' +
      htmlKpi('Usuários', fInt(st.totalUsuarios), htmlSub(fInt(st.usuariosHoje) + ' nas últimas 24 h · ' + fInt(st.usuariosSemana) + ' em 7 dias')) +
      htmlKpi('Mesas', fInt(st.totalMesas), htmlSub(fInt(st.mesasEmJogo) + ' em jogo')) +
      htmlKpi('Personagens', fInt(st.totalFichas), htmlSub(media(st.totalFichas, st.totalMesas) + ' por mesa, em média')) +
      htmlKpi('Registros no diário', fCompacto(st.totalLogs), htmlSub(media(st.totalLogs, st.totalMesas) + ' por mesa, em média')) +
    '</section><div class="grade g2">' +
      htmlCartao('g-usr', 'Novos usuários por dia', 'Últimos 30 dias (dias em UTC)') + htmlCartao('g-mes', 'Novas mesas por dia', 'Últimos 30 dias (dias em UTC)') + '</div>';
  marcarAtualizado(Date.now());
  const dias = []; for (let i = 29; i >= 0; i--) dias.push(new Date(Date.now() - i * 86400000).toISOString().slice(0, 10));
  const preencher = (linhas) => { const mapa = {}; (linhas || []).forEach((l) => { mapa[l.dia] = num(l.total); }); return dias.map((d) => mapa[d] || 0); };
  const base = { tipo: 'linha', rotulos: dias.map(diaCurto), rotulosLongos: dias.map(diaLongo) };
  graficoXY($('#g-usr'), Object.assign({ titulo: 'Novos usuários por dia', series: [{ nome: 'Novos usuários', cor: 'var(--s1)', valores: preencher(st.usuariosPorDia), area: true }] }, base));
  graficoXY($('#g-mes'), Object.assign({ titulo: 'Novas mesas por dia', series: [{ nome: 'Novas mesas', cor: 'var(--s2)', valores: preencher(st.mesasPorDia), area: true }] }, base));
}

/* ═══════════ Uso da IA ═══════════ */
async function telaUso(corpo, vivo) {
  const [m, uso] = await Promise.all([APP.getMetricas(APP._dias), APP.getUso(APP._dias).then((u) => ({ u }), (e) => ({ e }))]);
  if (!vivo()) return;
  limparGraficos();
  let html = '';
  const per = $('.periodo'); if (per) per.hidden = !m;
  if (!m) {
    html += '<p class="faixa" role="status"><strong>Gráficos indisponíveis.</strong> Este servidor ainda não tem a rota de métricas (<code>/api/admin/metricas</code>). As tabelas abaixo continuam funcionando.</p>';
  } else {
    const p = m.periodo || {}, a = m.anterior || {}, dias = num(m.dias);
    const ctx = 'em relação aos ' + dias + ' dias anteriores';
    const fundos = num(p.imagens) + num(p.fundosReaproveitados);
    html +=
      '<section class="kpis" aria-label="Indicadores de uso da IA">' +
        htmlKpi('Custo em ' + dias + ' dias', fUSD(p.custo), htmlDelta(p.custo, a.custo, ctx, null), 'sp-custo') +
        htmlKpi('Chamadas à IA', fCompacto(p.chamadasIA), htmlDelta(p.chamadasIA, a.chamadasIA, ctx, null), 'sp-cham') +
        htmlKpi('Tokens', fCompacto(num(p.tokensEntrada) + num(p.tokensSaida)), htmlSub(fCompacto(p.tokensEntrada) + ' de entrada · ' + fCompacto(p.tokensSaida) + ' de saída')) +
        htmlKpi('Imagens geradas', fInt(p.imagens), htmlDelta(p.imagens, a.imagens, ctx, null)) +
        htmlKpi('Fundos reaproveitados', fInt(p.fundosReaproveitados), htmlSub(fundos ? fPct((num(p.fundosReaproveitados) / fundos) * 100) + ' dos fundos não precisaram ser gerados' : 'nenhum fundo pedido no período')) +
      '</section><div class="grade g2">' +
        htmlCartao('u-custo', 'Custo por dia', 'Em dólares, como o provedor informa') +
        htmlCartao('u-cham', 'Chamadas à IA', '') +
        htmlCartao('u-tokens', 'Tokens por dia', 'Entrada (o que o jogo envia) e saída (o que a IA escreve)') +
        htmlCartao('u-img', 'Imagens geradas e fundos reaproveitados', '') +
      '</div><div class="grade">' + htmlCartao('u-modelos', 'Por modelo', 'Soma de ' + diaCurto(m.desde) + ' a ' + diaCurto(m.ate)) + '</div>';
  }
  html += '<div class="grade">' + htmlCartao('u-tipos', 'Totais por tipo de chamada', '') + htmlCartao('u-dias', 'Detalhe por dia', 'Uma linha por dia, tipo e modelo') + '</div>';
  corpo.innerHTML = html;
  marcarAtualizado(m ? m.geradoEm : Date.now());

  if (m) {
    const serie = m.serie || [];
    const rot = serie.map((d) => diaCurto(d.dia)), longos = serie.map((d) => diaLongo(d.dia));
    minilinha($('#sp-custo'), serie.map((d) => d.custo));
    minilinha($('#sp-cham'), serie.map((d) => d.chamadasIA));

/* ═══════════ Modais ═══════════ */
const MODAIS = [];
function abrirModal(titulo, html, opc) {
  opc = opc || {};
  const id = 'mt' + (++APP._n);
  const fundo = h('div', { class: 'modal-fundo' });
  fundo.innerHTML = '<div class="modal' + (opc.largo ? ' modal-largo' : '') + '" role="dialog" aria-modal="true" aria-labelledby="' + id + '"><div class="modal-topo"><h2 id="' + id + '">' + esc(titulo) +
    '</h2><button type="button" class="btn-x" data-acao="fechar-modal" aria-label="Fechar">×</button></div><div class="modal-corpo">' + html + '</div></div>';
  const reg = { fundo, corpo: $('.modal-corpo', fundo), antes: document.activeElement, aoFechar: opc.aoFechar };
  fundo.addEventListener('mousedown', (e) => { if (e.target === fundo && e.clientX < fundo.clientWidth) fecharModal(); });   // clicar na barra de rolagem do fundo não fecha
  document.body.appendChild(fundo);
  MODAIS.push(reg);
  document.body.classList.add('com-modal');
  focarModal(reg);
  return reg;
}
function focarModal(reg) {
  const alvo = $('[autofocus]', reg.corpo) || $('input:not([type=hidden]), select, textarea', reg.corpo) || $('.btn-x', reg.fundo);
  if (alvo) alvo.focus();
}
function fecharModal() {
  const reg = MODAIS.pop(); if (!reg) return;
  reg.fundo.remove();
  if (!MODAIS.length) document.body.classList.remove('com-modal');
  if (reg.aoFechar) reg.aoFechar();
  let alvo = reg.antes;
  // a lista por trás pode ter sido refeita com a janela aberta: procura o botão equivalente (mesma ação e mesma mesa ou ficha)
  if (alvo && !document.contains(alvo) && alvo.dataset && alvo.dataset.acao) {
    alvo = Array.prototype.find.call(document.querySelectorAll('[data-acao]'), (x) => x.dataset.acao === alvo.dataset.acao && x.dataset.cod === alvo.dataset.cod && x.dataset.uid === alvo.dataset.uid);
  }
  if (!alvo || !document.contains(alvo)) { const topo = MODAIS[MODAIS.length - 1]; if (topo) { focarModal(topo); return; } alvo = $('#conteudo'); }
  if (alvo) alvo.focus();
}
/** Depois de refazer o conteúdo de uma janela, o foco não pode ficar perdido fora dela. */
function manterFoco(reg) { if (MODAIS[MODAIS.length - 1] === reg && !reg.fundo.contains(document.activeElement)) focarModal(reg); }
function fecharTodos() { while (MODAIS.length) fecharModal(); }
const modalAberto = (reg) => MODAIS.indexOf(reg) >= 0;
const modalDoTipo = (tipo) => { for (let i = MODAIS.length - 1; i >= 0; i--) if (MODAIS[i].tipo === tipo) return MODAIS[i]; return null; };
function confirmar(titulo, texto, rotulo) {
  return new Promise((resolver) => {
    let ok = false;
    const reg = abrirModal(titulo, '<p>' + esc(texto) + '</p><div class="acoes"><button type="button" class="btn" data-acao="fechar-modal" autofocus>Cancelar</button><button type="button" class="btn btn-perigo" data-sim>' + esc(rotulo) + '</button></div>',
      { aoFechar: () => resolver(ok) });
    $('[data-sim]', reg.corpo).addEventListener('click', () => { ok = true; fecharModal(); });
  });
}
document.addEventListener('keydown', (e) => {
  const reg = MODAIS[MODAIS.length - 1]; if (!reg) return;
  if (e.key === 'Escape') { e.preventDefault(); fecharModal(); return; }
  if (e.key !== 'Tab') return;
  const itens = Array.prototype.filter.call(reg.fundo.querySelectorAll('button, input, select, textarea, a[href], summary, [tabindex="0"]'), (x) => !x.disabled && x.offsetParent !== null);
  if (!itens.length) return;
  const pri = itens[0], ult = itens[itens.length - 1];
  if (!reg.fundo.contains(document.activeElement)) { e.preventDefault(); pri.focus(); }
  else if (e.shiftKey && document.activeElement === pri) { e.preventDefault(); ult.focus(); }
  else if (!e.shiftKey && document.activeElement === ult) { e.preventDefault(); pri.focus(); }
});

    '</div><div class="acoes"><button type="submit" class="btn btn-primario">Salvar clima, período e ato</button><button type="button" class="btn" data-acao="mundo-encontro">Sortear encontro de estrada</button>' +
    '<button type="button" class="btn btn-perigo" data-acao="mundo-limpar">Limpar memória</button></div><p class="erro" role="alert" data-erro></p></form>' +
    '<h3><span>Fatos</span></h3>' + linhas(mundo.fatos, ([k, x]) => '<li><b>' + esc(k) + '</b>: ' + esc(x && typeof x === 'object' ? x.v : x) + '</li>') +
    '<h3><span>NPCs</span></h3>' + linhas(mundo.npcs, ([k, x]) => '<li><b>' + esc(k) + '</b>: ' + esc(x && typeof x === 'object' ? x.v : x) + '</li>') +
    '<h3><span>Reputação</span></h3>' + linhas(mundo.reputacao, ([k, v]) => '<li><b>' + esc(k) + '</b>: ' + (num(v) > 0 ? '+' : '') + esc(num(v)) + '</li>') +
    '<div class="acoes"><button type="button" class="btn empurra" data-acao="fechar-modal">' + (modalDoTipo('mesa') ? 'Voltar para a mesa' : 'Fechar') + '</button></div>';
  manterFoco(reg);
}
async function mudarMundo(reg, corpoReq, okMsg) {
  const erroEl = $('[data-erro]', reg.corpo); if (erroEl) erroEl.textContent = '';
  try { const d = await APP.salvarMundo(reg.cod, corpoReq); if (modalAberto(reg)) preencherMundo(reg, d); avisar(okMsg); }
  catch (e) { if (erroEl && modalAberto(reg)) erroEl.textContent = e.message; else avisar(e.message, true); }
}

/* ═══════════ Ações (cliques) e formulários ═══════════ */
const ACOES = {
  sair() { APP.sair(); },
  aba(b) { APP._tab = b.dataset.aba; renderAba(); window.scrollTo(0, 0); },
  periodo(b) { const d = Number(b.dataset.dias); if (PERIODOS.indexOf(d) < 0 || d === APP._dias) return; APP._dias = d; renderAba(true); },
  recarregar() { renderAba(true); },
  'fechar-modal'() { fecharModal(); },
  'abrir-mesa'(b) { abrirMesa(b.dataset.cod); },
  'nova-mesa'() {
    const cod = Math.random().toString(36).slice(2, 7).toUpperCase();
    abrirModal('Nova mesa',
      '<form data-form="nova-mesa" novalidate><div class="campos">' +
      '<div><label for="fcod">Código (3 a 6 letras ou números)</label><input id="fcod" name="codigo" value="' + esc(cod) + '" maxlength="6" autocapitalize="characters" spellcheck="false"></div>' +
      '<div><label for="ftom">Tom</label><select id="ftom" name="tom"><option value="epico">Épico</option><option value="sombrio">Sombrio</option><option value="humor">Humor</option></select></div>' +
      '<div class="inteira"><label for="fcena">Cena inicial</label><input id="fcena" name="cena" value="Taverna Javali Cego"></div>' +
      '</div><div class="acoes"><button type="submit" class="btn btn-primario">Criar mesa</button><button type="button" class="btn" data-acao="fechar-modal">Cancelar</button></div><p class="erro" role="alert" data-erro></p></form>');
  },
  async 'excluir-mesa'(b) {
    const cod = b.dataset.cod;
    if (!(await confirmar('Excluir a mesa ' + cod + '?', 'As fichas, os membros e o diário desta mesa serão apagados. Não dá para desfazer.', 'Excluir mesa'))) return;
    try { await APP.excluirMesa(cod); fecharTodos(); avisar('Mesa ' + cod + ' excluída.'); atualizarMesas(); }
    catch (e) { avisar('Não foi possível excluir a mesa ' + cod + ': ' + e.message, true); }
  },
  'nova-ficha'() {
    const mesa = modalDoTipo('mesa'); if (!mesa) return;
    const reg = abrirModal('Nova ficha na mesa ' + mesa.cod, htmlFormFicha({ uid: 'admin_' + Math.random().toString(36).slice(2, 8), raca: 'Humano', classe: 'Guerreiro', pv: 20, pvMax: 20 }, true));
    reg.tipo = 'ficha';
  },
  'editar-ficha'(b) {
    const mesa = modalDoTipo('mesa'); if (!mesa) return;
    const f = (mesa.fichas || []).find((x) => String(x.uid) === b.dataset.uid); if (!f) return;
    const reg = abrirModal('Editar ' + (f.nome || 'ficha'), htmlFormFicha(f, false));
    reg.tipo = 'ficha';
  },
  async 'excluir-ficha'(b) {
    const mesa = modalDoTipo('mesa'); if (!mesa) return;
    const uid = b.dataset.uid, f = (mesa.fichas || []).find((x) => String(x.uid) === uid) || {};
    if (!(await confirmar('Excluir a ficha?', 'A ficha de ' + (f.nome || 'sem nome') + ' será apagada da mesa ' + mesa.cod + '.', 'Excluir ficha'))) return;
    try { await APP.excluirFicha(mesa.cod, uid); avisar('Ficha excluída.'); await preencherMesa(mesa); atualizarMesas(); }
    catch (e) { avisar('Não foi possível excluir a ficha: ' + e.message, true); }
  },
  mundo() { const mesa = modalDoTipo('mesa'); if (mesa) abrirMundo(mesa.cod); },
  'mundo-encontro'() { const reg = modalDoTipo('mundo'); if (reg) mudarMundo(reg, { encontro: true }, 'Encontro sorteado.'); },
  async 'mundo-limpar'() {
    const reg = modalDoTipo('mundo'); if (!reg) return;
    if (await confirmar('Limpar a memória da mesa?', 'Fatos, NPCs, reputação e clima da mesa ' + reg.cod + ' serão apagados.', 'Limpar memória')) mudarMundo(reg, { limpar: true }, 'Memória da mesa apagada.');
  },
};
const FORMS = {
  async login(f) { await APP.login(f.elements.user.value.trim(), f.elements.pass.value); },
  async 'nova-mesa'(f) {
    const r = await APP.criarMesa({ codigo: f.elements.codigo.value, cena: f.elements.cena.value, tom: f.elements.tom.value });
    fecharModal(); avisar('Mesa ' + ((r && r.codigo) || '') + ' criada.'); atualizarMesas();
  },
  async mesa(f) {
    const mesa = modalDoTipo('mesa'); if (!mesa) return;
    await APP.editarMesa(mesa.cod, { cena: f.elements.cena.value, fase: f.elements.fase.value, tom: f.elements.tom.value, resumo: f.elements.resumo.value });
    avisar('Mesa ' + mesa.cod + ' salva.'); atualizarMesas();
  },
  async 'nova-ficha'(f) {
    const mesa = modalDoTipo('mesa'); if (!mesa) return;
    const e = f.elements;
    if (!e.nome.value.trim()) throw new Error('Dê um nome ao personagem.');
    await APP.criarFicha(mesa.cod, { uid: e.uid.value.trim(), nome: e.nome.value.trim(), raca: e.raca.value, classe: e.classe.value, pv: Number(e.pv.value), pvMax: Number(e.pvMax.value) });
    fecharModal(); avisar('Ficha criada.'); await preencherMesa(mesa); atualizarMesas();
  },
  async 'editar-ficha'(f) {
    const mesa = modalDoTipo('mesa'); if (!mesa) return;
    const e = f.elements;
    await APP.editarFicha(mesa.cod, f.dataset.uid, { nome: e.nome.value, raca: e.raca.value, classe: e.classe.value, pv: Number(e.pv.value), pvMax: Number(e.pvMax.value), nivel: Number(e.nivel.value), xp: Number(e.xp.value) });
    fecharModal(); avisar('Ficha salva.'); await preencherMesa(mesa);
  },
  async mundo(f) {
    const reg = modalDoTipo('mundo'); if (!reg) return;
    const d = await APP.salvarMundo(reg.cod, { clima: f.elements.clima.value, periodo: f.elements.periodo.value, ato: Number(f.elements.ato.value) });
    if (modalAberto(reg)) preencherMundo(reg, d);
    avisar('Mundo da mesa salvo.');
  },
};
document.addEventListener('click', (e) => {
  const b = e.target.closest ? e.target.closest('[data-acao]') : null;
  if (!b || b.disabled) return;
  const f = ACOES[b.dataset.acao];
  if (f) { e.preventDefault(); f(b); }
});
document.addEventListener('submit', async (e) => {
  const form = e.target, f = FORMS[form.dataset && form.dataset.form];
  if (!f) return;
  e.preventDefault();
  const botao = form.querySelector('[type=submit]'), erroEl = form.querySelector('[data-erro]');
  if (botao && botao.disabled) return;
  if (erroEl) erroEl.textContent = '';
  if (botao) botao.disabled = true;
  try { await f(form); }
  catch (er) { if (erroEl && document.contains(erroEl)) erroEl.textContent = er.message; else if (APP._token) avisar(er.message, true); }
  finally { if (botao) botao.disabled = false; }
});
document.addEventListener('input', (e) => {
  const sel = e.target.dataset && e.target.dataset.filtro; if (!sel) return;
  const termo = e.target.value.trim().toLowerCase();
  document.querySelectorAll(sel).forEach((corpo) => {
    let visiveis = 0;
    corpo.querySelectorAll('tr[data-busca]').forEach((tr) => { const ok = !termo || tr.dataset.busca.indexOf(termo) >= 0; tr.hidden = !ok; if (ok) visiveis++; });
    const vazio = corpo.querySelector('.sem-resultado'); if (vazio) vazio.hidden = visiveis > 0;
  });
});

/* ═══════════ Início ═══════════ */
try { const g = JSON.parse(sessionStorage.getItem(GUARDA) || 'null'); if (g && g.t) { APP._token = g.t; APP._user = g.u || 'admin'; } } catch (e) {}
renderApp();
</script>
</body>
</html>
