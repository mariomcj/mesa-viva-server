<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Mesa Viva</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font: 14px/1.5 system-ui, sans-serif; background: #0d0a0a; color: #e0d8cc; display: flex; flex-direction: column; min-height: 100vh; }
a { color: #c8a050; }
h1, h2, h3 { font-weight: 600; }
h1 { font-size: 1.3rem; }
h2 { font-size: 1.1rem; margin: 1rem 0 .5rem; border-bottom: 1px solid #443; padding-bottom: .3rem; }
.card { background: #1a1410; border: 1px solid #332; border-radius: 8px; padding: 1rem; margin-bottom: .75rem; box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.btn { display: inline-block; padding: .5rem 1rem; border-radius: 6px; border: none; cursor: pointer; font-size: .9rem; }
.btn-primary { background: #8a6a30; color: #fff; }
.btn-danger { background: #6a2020; color: #fff; }
.btn-sm { padding: .3rem .6rem; font-size: .8rem; }
.badge { display: inline-block; background: #443; padding: .15rem .5rem; border-radius: 4px; font-size: .8rem; }
.badge-lobby { background: #667; color: #c8d0e0; }
.badge-jogo { background: #4a8; color: #fff; }
.grid { display: grid; gap: .75rem; }
.cols-2 { grid-template-columns: 1fr 1fr; }
.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
input, select, textarea { background: #221e1a; color: #e0d8cc; border: 1px solid #443; border-radius: 6px; padding: .5rem; font: inherit; width: 100%; }
label { display: block; font-size: .85rem; color: #b0a898; margin-bottom: .25rem; }
.table { width: 100%; border-collapse: collapse; }
.table th, .table td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #332; font-size: .85rem; }
.table th { color: #c8a050; font-weight: 600; }
.table tr:nth-child(even) td { background: #15110e; }
.table tr:hover td { background: #1f1914; }
#login { max-width: 360px; margin: 4rem auto; }
#login .card { padding: 2rem; }
#login h1 { text-align: center; margin-bottom: 1.5rem; color: #c8a050; }
.erro { color: #c84a4a; font-size: .85rem; margin-top: .3rem; }
.aviso { color: #a09070; font-size: .85rem; }
.topo { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: #1a1410; border-bottom: 1px solid #443; margin-bottom: 1rem; }
.topo .user { font-size: .8rem; color: #b0a898; }
.section-header { display: flex; justify-content: space-between; align-items: center; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: #1a1410; border: 1px solid #554; border-radius: 10px; padding: 1.5rem; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
.modal h2 { margin-top: 0; }
.modal .btn { margin-top: .5rem; }
.flex { display: flex; gap: .5rem; }
.mt-1 { margin-top: .5rem; }
.mb-1 { margin-bottom: .5rem; }
.tabs { display: flex; gap: 0; background: #221e1a; border-radius: 6px; overflow: hidden; margin-bottom: 1rem; }
.tabs button { background: transparent; border: none; padding: .5rem 1rem; cursor: pointer; color: #b0a898; font-size: .85rem; }
.tabs button.ativo { background: #8a6a30; color: #fff; }
.kpi-card { text-align: center; padding: 1.2rem .8rem; }
.kpi-card .kpi-val { font-size: 1.8rem; font-weight: 700; display: block; color: #c8a050; }
.kpi-card .kpi-label { font-size: .75rem; color: #b0a898; display: block; margin-top: .2rem; }
.kpi-card .kpi-sub { font-size: .7rem; color: #887; display: block; margin-top: .15rem; }
.nowrap { white-space: nowrap; }
.table-wrap { overflow-x: auto; }
@media (max-width:600px) {
  body { font-size: 13px; }
  .grid.cols-2 { grid-template-columns: 1fr; }
  .grid.cols-3 { grid-template-columns: 1fr; }
  .grid.cols-4 { grid-template-columns: 1fr 1fr; }
  .tabs button { padding: .4rem .6rem; font-size: .8rem; }
  .kpi-card { padding: .8rem .5rem; }
  .kpi-card .kpi-val { font-size: 1.4rem; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const APP = {
  _token: null,
  _user: null,
  _tab: 'geral',
  async req(method, path, body) {
    const h = { 'Content-Type': 'application/json' };
    if (this._token) h['X-Admin-Token'] = this._token;
    const r = await fetch(path, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) { const e = await r.json().catch(()=>({error:r.statusText})); throw new Error(e.error||r.statusText); }
    return r.json();
  },
  async login(user, pass) {
    const r = await this.req('POST', '/api/admin/login', { user, pass });
    this._token = r.token;
    this._user = user;
    this.render();
  },
  async logout() { this._token = null; this._user = null; this.render(); },
  async listarMesas() { return this.req('GET', '/api/admin/mesas'); },
  async getMesa(cod) { return this.req('GET', `/api/admin/mesas/${cod}`); },
  async criarMesa(d) { return this.req('POST', '/api/admin/mesas', d); },
  async editarMesa(cod, d) { return this.req('PUT', `/api/admin/mesas/${cod}`, d); },
  async excluirMesa(cod) { return this.req('DELETE', `/api/admin/mesas/${cod}`); },
  async criarFicha(cod, d) { return this.req('POST', `/api/admin/fichas/${cod}`, d); },
  async editarFicha(cod, uid, d) { return this.req('PUT', `/api/admin/fichas/${cod}/${uid}`, d); },
  async excluirFicha(cod, uid) { return this.req('DELETE', `/api/admin/fichas/${cod}/${uid}`); },
  async listarUsuarios() { return this.req('GET', '/api/admin/usuarios'); },
  async getEstatisticas() { return this.req('GET', '/api/admin/estatisticas'); },
};

window.onload = () => APP.render();

APP.render = async function() {
  const app = document.getElementById('app');
  if (!this._token) return renderLogin(app);
  try {
    const dados = await this.listarMesas();
    renderDashboard(app, dados);
  } catch(e) {
    if (e.message?.includes('401') || e.message?.includes('não autenticado')) {
      this._token = null; this._user = null;
      return renderLogin(app);
    }
    app.innerHTML = `<div class="card"><p class="erro">Erro: ${e.message}</p><button class="btn btn-primary" onclick="APP.render()">Tentar novamente</button></div>`;
  }
};

function renderLogin(parent) {
  parent.innerHTML = `
    <div id="login"><div class="card">
      <h1>🎲 Admin Mesa Viva</h1>
      <label>Usuário</label>
      <input id="luser" value="admin" onkeydown="if(event.key==='Enter')APP.login(this.value,document.getElementById('lpass').value)">
      <label class="mt-1">Senha</label>
      <input id="lpass" type="password" onkeydown="if(event.key==='Enter')APP.login(document.getElementById('luser').value,this.value)">
      <div class="mt-1"><button class="btn btn-primary" onclick="APP.login(document.getElementById('luser').value,document.getElementById('lpass').value)">Entrar</button></div>
      <p id="lerro" class="erro"></p>
    </div></div>
  `;
}

async function renderDashboard(parent, dados) {
  const mesas = dados.mesas || [];
  const emJogo = mesas.filter(m => m.fase === 'jogo');
  const emLobby = mesas.filter(m => m.fase !== 'jogo');
  const activeTab = APP._tab;
  parent.innerHTML = `
    <div class="topo">
      <div><h1>🎲 Admin Mesa Viva</h1></div>
      <div class="user">${APP._user} &mdash; <a href="#" onclick="APP.logout();return false">sair</a></div>
    </div>
    <div style="max-width:960px;margin:0 auto;padding:0 1rem">
      <div class="tabs">
        <button class="${activeTab==='geral'?'ativo':''}" onclick="APP._tab='geral';APP.render()">📊 Visão Geral</button>
        <button class="${activeTab==='mesas'?'ativo':''}" onclick="APP._tab='mesas';APP.render()">🎲 Mesas (${mesas.length})</button>
        <button class="${activeTab==='usuarios'?'ativo':''}" onclick="APP._tab='usuarios';APP.render()">👥 Usuários</button>
      </div>
      <div id="tab-content"></div>
    </div>
  `;
  if (activeTab === 'geral') renderVisaoGeral('tab-content', mesas);
  else if (activeTab === 'usuarios') renderUsuarios('tab-content');
  else renderTabMesas('tab-content', mesas, emJogo, emLobby);
}

function badgeFase(fase) {
  const cls = fase === 'jogo' ? 'badge-jogo' : 'badge-lobby';
  return `<span class="badge ${cls}">${fase}</span>`;
}

function fmtData(ms) {
  if (!ms) return '—';
  const d = new Date(Number(ms));
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
}

function fmtDataCurta(ms) {
  if (!ms) return '—';
  const d = new Date(Number(ms));
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' });
}

async function renderVisaoGeral(elId, mesas) {
  const el = document.getElementById(elId);
  try {
    const stats = await APP.getEstatisticas();
    const hj = new Date();
    const dias = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date(hj);
      d.setDate(d.getDate() - i);
      dias.push(d.toISOString().slice(0, 10));
    }
    // montar dict usuariosPorDia (últimos 7)
    const usrPorDia = {};
    (stats.usuariosPorDia||[]).forEach(r => { usrPorDia[r.dia] = r.total; });
    const mesasPorDia = {};
    (stats.mesasPorDia||[]).forEach(r => { mesasPorDia[r.dia] = r.total; });
    const usr7 = dias.map(dia => ({ dia, total: usrPorDia[dia] || 0 }));
    const mes7 = dias.map(dia => ({ dia, total: mesasPorDia[dia] || 0 }));
    el.innerHTML = `
      <div class="grid cols-4" style="margin-bottom:1rem">
        <div class="card kpi-card">
          <span class="kpi-val">${stats.totalUsuarios}</span>
          <span class="kpi-label">👤 Usuários</span>
          <span class="kpi-sub">${stats.usuariosHoje} hoje · ${stats.usuariosSemana} na semana</span>
        </div>
        <div class="card kpi-card">
          <span class="kpi-val">${stats.totalMesas}</span>
          <span class="kpi-label">🎲 Mesas</span>
          <span class="kpi-sub">${stats.mesasEmJogo} em jogo</span>
        </div>
        <div class="card kpi-card">
          <span class="kpi-val">${stats.totalFichas}</span>
          <span class="kpi-label">📋 Fichas</span>
          <span class="kpi-sub">${stats.totalMesas > 0 ? Math.round(stats.totalFichas / stats.totalMesas * 10) / 10 : 0} média/mesa</span>
        </div>
        <div class="card kpi-card">
          <span class="kpi-val">${stats.totalLogs}</span>
          <span class="kpi-label">📜 Logs</span>
          <span class="kpi-sub">${stats.totalMesas > 0 ? Math.round(stats.totalLogs / stats.totalMesas) : 0} média/mesa</span>
        </div>
      </div>
      <div class="grid cols-2">
        <div class="card">
          <h2>📅 Usuários por dia (7 dias)</h2>
          ${montarTabelaDia(usr7)}
        </div>
        <div class="card">
          <h2>📅 Mesas por dia (7 dias)</h2>
          ${montarTabelaDia(mes7)}
        </div>
      </div>
    `;
  } catch(e) {
    el.innerHTML = `<div class="card"><p class="erro">Erro ao carregar estatísticas: ${e.message}</p></div>`;
  }
}

function montarTabelaDia(arr) {
  if (!arr || !arr.length) return '<p class="aviso">Nenhum dado.</p>';
  let rows = '';
  arr.forEach(r => {
    const data = r.dia ? r.dia.split('-').reverse().join('/') : r.dia;
    rows += `<tr><td class="nowrap">${r.dia||'—'}</td><td style="text-align:right">${r.total}</td></tr>`;
  });
  return `<div class="table-wrap"><table class="table"><tr><th>Dia</th><th style="text-align:right">Total</th></tr>${rows}</table></div>`;
}

function renderTabMesas(elId, mesas, emJogo, emLobby) {
  const el = document.getElementById(elId);
  el.innerHTML = `
    <div class="section-header">
      <h2>Mesas ativas (${emJogo.length})</h2>
      <button class="btn btn-primary btn-sm" onclick="novaMesa()">+ Nova mesa</button>
    </div>
    <div id="lista-jogo"></div>
    ${emLobby.length ? `<h2 class="mt-1">Lobby (${emLobby.length})</h2><div id="lista-lobby"></div>` : ''}
  `;
  renderLista('lista-jogo', emJogo);
  if (emLobby.length) renderLista('lista-lobby', emLobby);
}

function renderLista(id, mesas) {
  const el = document.getElementById(id);
  if (!mesas.length) { el.innerHTML = '<p class="aviso">Nenhuma mesa.</p>'; return; }
  el.innerHTML = `<div class="table-wrap"><table class="table">
    <tr><th>Código</th><th>Dono</th><th>Fase</th><th>Cena</th><th>Membros</th><th>Fichas</th><th></th></tr>
    ${mesas.map(m => `<tr>
      <td><a href="#" onclick="APP.verMesa('${m.codigo}');return false"><strong>${m.codigo}</strong></a></td>
      <td>${esc(m.dono_nome||m.dono||'—')}</td>
      <td>${badgeFase(m.fase)}</td>
      <td>${esc(m.cena||'—')}</td>
      <td>${m.qtd_membros}</td>
      <td>${m.qtd_fichas}</td>
      <td><button class="btn btn-danger btn-sm" onclick="confirmarExcluir('${m.codigo}')">🗑</button></td>
    </tr>`).join('')}
  </table></div>`;
}

async function renderUsuarios(elId) {
  const el = document.getElementById(elId);
  try {
    const dados = await APP.listarUsuarios();
    const usuarios = dados.usuarios || [];
    el.innerHTML = `
      <h2>👥 Usuários registrados (${usuarios.length})</h2>
      ${usuarios.length ? `<div class="table-wrap"><table class="table">
        <tr><th>ID</th><th>Nome</th><th>Email</th><th>Registro</th><th>Mesas (criou)</th><th>Mesas (membro)</th></tr>
        ${usuarios.map(u => `<tr>
          <td>${esc(u.id)}</td>
          <td>${esc(u.nome)}</td>
          <td>${esc(u.email||'—')}</td>
          <td class="nowrap">${fmtData(u.criadoEm)}</td>
          <td>${u.qtd_mesas_criadas}</td>
          <td>${u.qtd_mesas_membro}</td>
        </tr>`).join('')}
      </table></div>` : '<p class="aviso">Nenhum usuário.</p>'}
    `;
  } catch(e) {
    el.innerHTML = `<div class="card"><p class="erro">Erro ao carregar usuários: ${e.message}</p></div>`;
  }
}

async function novaMesa() {
  const cod = Math.random().toString(36).slice(2, 7).toUpperCase();
  const html = `
    <div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal">
      <h2>Nova mesa</h2>
      <label>Código</label><input id="fcod" value="${cod}">
      <label class="mt-1">Cena inicial</label><input id="fcena" value="Taverna Javali Cego">
      <label class="mt-1">Tom</label>
      <select id="ftom"><option value="epico">Épico</option><option value="sombrio">Sombrio</option><option value="humor">Humor</option></select>
      <div class="flex mt-1">
        <button class="btn btn-primary" onclick="criarMesa()">Criar</button>
        <button class="btn" onclick="fecharModal()">Cancelar</button>
      </div>
      <p id="merro" class="erro"></p>
    </div></div>
  `;
  const m = document.createElement('div'); m.innerHTML = html; document.body.appendChild(m.firstElementChild);
  window.criarMesa = async () => {
    try {
      await APP.criarMesa({ codigo: document.getElementById('fcod').value, cena: document.getElementById('fcena').value, tom: document.getElementById('ftom').value });
      fecharModal(); APP.render();
    } catch(e) { document.getElementById('merro').textContent = e.message; }
  };
}

function verMesa(cod) {
  APP.verMesa(cod);
}

APP.verMesa = async function(cod) {
  const dados = await this.getMesa(cod);
  const m = dados.mesa, fichas = dados.fichas || [], membros = dados.membros || [];
  const html = `
    <div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal">
      <h2>${esc(m.codigo)}</h2>
      <div class="grid cols-2" style="margin-bottom:.5rem">
        <div><label>Cena</label><input id="mcena" value="${esc(m.cena||'')}"></div>
        <div><label>Fase</label><select id="mfase"><option ${m.fase==='lobby'?'selected':''}>lobby</option><option ${m.fase==='jogo'?'selected':''}>jogo</option></select></div>
        <div><label>Tom</label><input id="mtom" value="${esc(m.tom||'')}"></div>
        <div><label>Resumo</label><textarea id="mresumo" rows="2">${esc(m.resumo||'')}</textarea></div>
      </div>
      <div class="flex"><button class="btn btn-primary btn-sm" onclick="APP.editarMesa('${cod}',{cena:document.getElementById('mcena').value,fase:document.getElementById('mfase').value,tom:document.getElementById('mtom').value,resumo:document.getElementById('mresumo').value});APP.render()">Salvar mesa</button></div>
      <h3>Fichas (${fichas.length})</h3>
      ${fichas.length ? `<table class="table"><tr><th>Nome</th><th>Raça</th><th>Classe</th><th>PV</th><th>Nível</th><th></th></tr>
        ${fichas.map(f => `<tr>
          <td><a href="#" onclick="editarFicha('${cod}','${f.uid}');return false">${esc(f.nome||'?')}</a></td>
          <td>${esc(f.raca||'—')}</td>
          <td>${esc(f.classe||'—')}</td>
          <td>${f.pv||0}/${f.pvMax||0}</td>
          <td>${f.nivel||1}</td>
          <td><button class="btn btn-danger btn-sm" onclick="if(confirm('Excluir ${esc(f.nome)}?'))APP.excluirFicha('${cod}','${f.uid}').then(()=>APP.verMesa('${cod}'))">🗑</button></td>
        </tr>`).join('')}</table>` : '<p class=\"aviso\">Nenhuma ficha.</p>'}
      <button class="btn btn-primary btn-sm mt-1" onclick="novaFicha('${cod}')">+ Nova ficha</button>
      <h3 class="mt-1">Membros (${membros.length})</h3>
      ${membros.length ? `<div class="flex" style="flex-wrap:wrap;gap:.3rem">${membros.map(p => `<span class="badge">${esc(p.nome||p.uid.slice(0,8))}</span>`).join(' ')}</div>` : '<p class=\"aviso\">Nenhum membro.</p>'}
      <div class="flex mt-1">
        <button class="btn btn-danger" onclick="if(confirm('Excluir mesa ${cod}? Isso apaga fichas, membros e logs.')){APP.excluirMesa('${cod}');fecharModal();APP.render()}">Excluir mesa</button>
        <button class="btn" onclick="fecharModal()">Fechar</button>
      </div>
    </div></div>
  `;
  const mEl = document.createElement('div'); mEl.innerHTML = html; document.body.appendChild(mEl.firstElementChild);
};

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }
function fecharModal() { const m = document.querySelector('.modal-bg'); if(m) m.remove(); }

function confirmarExcluir(cod) {
  const el = document.createElement('div');
  el.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal">
    <h2>Excluir ${cod}?</h2>
    <p>Todas as fichas, membros e logs serão apagados.</p>
    <div class="flex mt-1">
      <button class="btn btn-danger" onclick="APP.excluirMesa('${cod}').then(()=>{fecharModal();APP.render()})">Excluir</button>
      <button class="btn" onclick="fecharModal()">Cancelar</button>
    </div>
  </div></div>`;
  document.body.appendChild(el.firstElementChild);
}

function novaFicha(cod) {
  const html = `
    <div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal">
      <h2>Nova ficha</h2>
      <div class="grid cols-2">
        <div><label>Nome</label><input id="fnome"></div>
        <div><label>UID</label><input id="fuid" value="admin_${Math.random().toString(36).slice(2,8)}"></div>
        <div><label>Raça</label><input id="fraca" value="Humano"></div>
        <div><label>Classe</label><input id="fclasse" value="Guerreiro"></div>
        <div><label>PV</label><input id="fpv" value="20"></div>
        <div><label>PV Max</label><input id="fpvmax" value="20"></div>
      </div>
      <div class="flex mt-1">
        <button class="btn btn-primary" onclick="criarFicha('${cod}')">Criar</button>
        <button class="btn" onclick="fecharModal()">Cancelar</button>
      </div>
      <p id="ferro" class="erro"></p>
    </div></div>
  `;
  const m = document.createElement('div'); m.innerHTML = html; document.body.appendChild(m.firstElementChild);
  window.criarFicha = async (cod) => {
    try {
      await APP.criarFicha(cod, {
        uid: document.getElementById('fuid').value,
        nome: document.getElementById('fnome').value,
        raca: document.getElementById('fraca').value,
        classe: document.getElementById('fclasse').value,
        pv: Number(document.getElementById('fpv').value),
        pvMax: Number(document.getElementById('fpvmax').value)
      });
      fecharModal(); APP.verMesa(cod);
    } catch(e) { document.getElementById('ferro').textContent = e.message; }
  };
}

function editarFicha(cod, uid) {
  APP.getMesa(cod).then(dados => {
    const f = (dados.fichas||[]).find(f => f.uid === uid);
    if (!f) return;
    const html = `
      <div class="modal-bg" onclick="if(event.target===this)fecharModal()"><div class="modal">
        <h2>Editar ${esc(f.nome)}</h2>
        <div class="grid cols-2">
          <div><label>Nome</label><input id="efnome" value="${esc(f.nome)}"></div>
          <div><label>Raça</label><input id="efraca" value="${esc(f.raca||'')}"></div>
          <div><label>Classe</label><input id="efclasse" value="${esc(f.classe||'')}"></div>
          <div><label>PV</label><input id="efpv" value="${f.pv||0}"></div>
          <div><label>PV Max</label><input id="efpvmax" value="${f.pvMax||0}"></div>
          <div><label>Nível</label><input id="efnivel" value="${f.nivel||1}"></div>
          <div><label>XP</label><input id="efxp" value="${f.xp||0}"></div>
        </div>
        <div class="flex mt-1">
          <button class="btn btn-primary" onclick="salvarFicha('${cod}','${uid}')">Salvar</button>
          <button class="btn" onclick="fecharModal()">Cancelar</button>
        </div>
        <p id="eferro" class="erro"></p>
      </div></div>
    `;
    const m = document.createElement('div'); m.innerHTML = html; document.body.appendChild(m.firstElementChild);
    window.salvarFicha = async (cod, uid) => {
      try {
        await APP.editarFicha(cod, uid, {
          nome: document.getElementById('efnome').value,
          raca: document.getElementById('efraca').value,
          classe: document.getElementById('efclasse').value,
          pv: Number(document.getElementById('efpv').value),
          pvMax: Number(document.getElementById('efpvmax').value),
          nivel: Number(document.getElementById('efnivel').value),
          xp: Number(document.getElementById('efxp').value)
        });
        fecharModal(); APP.verMesa(cod);
      } catch(e) { document.getElementById('eferro').textContent = e.message; }
    };
  });
}
</script>
</body>
</html>
